<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Key Feed</title>
  <style>
    :root {
      --bg-1: #06131d;
      --bg-2: #101b2e;
      --panel: rgba(9, 15, 24, 0.88);
      --bubble: linear-gradient(135deg, #2563eb, #38bdf8);
      --pasted-bubble: linear-gradient(135deg, #b45309, #f59e0b);
      --text: #edf7ff;
      --muted: #9bb7d4;
      --accent: #7dd3fc;
      --border: rgba(148, 163, 184, 0.18);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 32%), linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px;
    }
    .app {
      width: min(100%, 980px);
      height: min(88vh, 760px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 28px 80px var(--shadow);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: rgba(10, 15, 24, 0.9);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--accent);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.9);
    }
    .status {
      padding: 14px 20px 0;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
    }
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 24px;
      background: rgba(2, 6, 12, 0.12);
      scroll-behavior: smooth;
    }
    .bubble-wrap {
      display: flex;
      justify-content: flex-start;
      margin: 12px 0;
      animation: rise 0.22s ease;
    }
    .bubble {
      max-width: 78%;
      background: var(--bubble);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px 18px 18px 6px;
      padding: 12px 14px 10px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }
    .bubble.pasted {
      background: var(--pasted-bubble);
      border-color: rgba(253, 230, 138, 0.5);
    }
    .paste-label {
      display: block;
      margin-bottom: 6px;
      color: #fffbeb;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .time {
      display: block;
      margin-top: 6px;
      opacity: 0.82;
      font-size: 0.68rem;
      text-align: right;
    }
    .device {
      display: block;
      margin-top: 3px;
      opacity: 0.72;
      font-size: 0.64rem;
      text-align: left;
    }
    .source {
      display: block;
      margin-top: 3px;
      opacity: 0.82;
      font-size: 0.66rem;
      text-align: left;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Live Key Feed</div>
    </div>
    <div class="status" id="status">Waiting for live stream…</div>
    <div class="feed" id="feed"></div>
  </div>

  <script>
    const feed = document.getElementById('feed');
    const statusEl = document.getElementById('status');

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(msg) {
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';

      const bubble = document.createElement('div');
      bubble.className = `bubble${msg.is_pasted ? ' pasted' : ''}`;
      bubble.textContent = msg.text;

      if (msg.is_pasted) {
        const label = document.createElement('span');
        label.className = 'paste-label';
        label.textContent = 'Pasted';
        bubble.prepend(label);
      }

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(msg.time);
      bubble.appendChild(time);

      const device = document.createElement('span');
      device.className = 'device';
      device.textContent = `From device ${msg.device_id || 'unknown'}${msg.device_name ? ` (${msg.device_name})` : ''}`;
      bubble.appendChild(device);

      const source = document.createElement('span');
      source.className = 'source';
      source.textContent = `Entered in: ${msg.app_name || 'Unknown app'}`;
      bubble.appendChild(source);

      wrap.appendChild(bubble);
      feed.appendChild(wrap);
      feed.scrollTop = feed.scrollHeight;
    }

    async function loadInitialMessages() {
      try {
        const res = await fetch('/messages');
        if (!res.ok) throw new Error('failed');
        const messages = await res.json();
        feed.innerHTML = '';
        messages.forEach(addMessage);
        statusEl.textContent = 'Latest messages: ' + messages.length;
      } catch (err) {
        statusEl.textContent = 'Listening for new messages…';
      }
    }

    const eventSource = new EventSource('/events');
    eventSource.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      addMessage(msg);
      statusEl.textContent = 'Live stream connected';
    };
    eventSource.onerror = () => {
      statusEl.textContent = 'Reconnect in progress…';
    };

    loadInitialMessages();
  </script>
</body>
</html>
