services:
  - type: web
    name: tor-render-pipeline
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_AUTH_SECRET
        sync: false
      - key: TOR_ENDPOINT
        sync: false
