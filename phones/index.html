<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102a43" />
  <title>Phone Text Sender</title>
  <style>
    :root {
      --ink: #102a43;
      --muted: #627d98;
      --paper: #f0f4f8;
      --panel: #ffffff;
      --line: #d9e2ec;
      --send: #0f766e;
      --send-dark: #115e59;
      --pasted: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      color: var(--ink);
      background: linear-gradient(145deg, #d9eaf7, var(--paper) 48%, #e6fffa);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100%, 680px); margin: 0 auto; }
    header { padding: 18px 2px 22px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--send);
      font: 700 0.72rem/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 9vw, 3.6rem); line-height: 0.98; }
    .panel {
      padding: 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(16, 42, 67, 0.12);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(16, 42, 67, 0.12);
    }
    label {
      display: block;
      margin: 0 0 7px;
      color: var(--muted);
      font: 700 0.74rem/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    input, textarea, button { width: 100%; font: inherit; }
    input, textarea {
      padding: 13px 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--send); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14); }
    textarea { min-height: 180px; margin-top: 18px; resize: vertical; line-height: 1.5; }
    button {
      margin-top: 12px;
      padding: 14px;
      color: #fff;
      background: var(--send);
      border: 0;
      border-radius: 6px;
      font: 700 0.95rem "Segoe UI", sans-serif;
      cursor: pointer;
    }
    button:active { background: var(--send-dark); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .status { min-height: 1.4em; margin: 12px 2px 0; color: var(--muted); font: 0.86rem "Segoe UI", sans-serif; }
    .status.pasted { color: var(--pasted); font-weight: 700; }
    .feed-link { display: inline-block; margin-top: 20px; color: var(--send-dark); font: 700 0.88rem "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Live Key Feed</p>
      <h1>Send from phone</h1>
    </header>
    <section class="panel">
      <label for="device">Device name</label>
      <input id="device" autocomplete="off" maxlength="80" placeholder="My phone" />
      <label for="message" style="margin-top: 18px">Text</label>
      <textarea id="message" placeholder="Type or paste text here..."></textarea>
      <button id="send" type="button">Send text</button>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
    <a class="feed-link" href="/">View live feed</a>
  </main>
  <script>
    const deviceInput = document.getElementById('device');
    const messageInput = document.getElementById('message');
    const sendButton = document.getElementById('send');
    const status = document.getElementById('status');
    const savedDevice = localStorage.getItem('live-key-device');
    const deviceId = localStorage.getItem('live-key-device-id') || `phone-${crypto.randomUUID ? crypto.randomUUID().slice(0, 12) : Date.now()}`;
    let containsPaste = false;

    deviceInput.value = savedDevice || `${navigator.platform || 'Phone'} phone`;
    localStorage.setItem('live-key-device-id', deviceId);
    deviceInput.addEventListener('input', () => localStorage.setItem('live-key-device', deviceInput.value));
    messageInput.addEventListener('input', () => {
      if (!messageInput.value) containsPaste = false;
      status.textContent = containsPaste ? 'Pasted text ready' : '';
      status.className = containsPaste ? 'status pasted' : 'status';
    });
    messageInput.addEventListener('paste', (event) => {
      const text = event.clipboardData?.getData('text/plain') || '';
      event.preventDefault();
      if (!text) {
        status.textContent = 'Only text can be pasted';
        status.className = 'status';
        return;
      }
      const start = messageInput.selectionStart;
      const end = messageInput.selectionEnd;
      messageInput.setRangeText(text, start, end, 'end');
      containsPaste = true;
      status.textContent = 'Pasted text ready';
      status.className = 'status pasted';
    });

    sendButton.addEventListener('click', async () => {
      const text = messageInput.value.trim();
      if (!text) {
        status.textContent = 'Enter or paste some text first';
        return;
      }
      sendButton.disabled = true;
      status.textContent = 'Sending...';
      try {
        const response = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            device_id: deviceId,
            device_name: deviceInput.value.trim() || 'Phone',
            app_name: 'Phone web client',
            is_pasted: containsPaste
          })
        });
        if (!response.ok) throw new Error('send failed');
        messageInput.value = '';
        containsPaste = false;
        status.className = 'status';
        status.textContent = 'Sent';
      } catch (error) {
        status.className = 'status';
        status.textContent = 'Could not send text';
      } finally {
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
